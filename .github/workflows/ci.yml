name: CI

# `schedule` and `workflow_dispatch` exist for the live Cursor canary only.
# Triggers are workflow-wide in Actions, so every job below carries an `if:`
# that scopes it to the events it is actually for.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: typecheck · test · build (node ${{ matrix.node-version }})
    # Code CI only. The weekly/manual triggers are for the live canary.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.x", "26.x"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Verify lockfile uses only the public npm registry
        run: |
          if grep -E '"resolved":[[:space:]]*"https?://' package-lock.json | grep -vq 'https://registry.npmjs.org/'; then
            echo "::error::package-lock.json contains non-npmjs resolved URLs:"
            grep -nE '"resolved":[[:space:]]*"https?://' package-lock.json | grep -v 'https://registry.npmjs.org/' || true
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify committed bundle matches source
        run: git diff --exit-code -- dist

  package:
    name: script-disabled package install (node 26)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify committed provider bundle
        run: node --input-type=module -e 'import("./dist/provider/index.js").then(({createCursor}) => { if (typeof createCursor !== "function") process.exit(1) })'

      - name: Pack and install without lifecycle scripts
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/package-smoke"
          cd "$RUNNER_TEMP/package-smoke"
          npm init --yes >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/oy-cli-opencode-cursor-*.tgz
          node --input-type=module -e 'import("@oy-cli/opencode-cursor").then(({createCursor}) => { if (typeof createCursor !== "function") process.exit(1) })'

      - name: Audit production dependencies
        run: npm audit --omit=dev

  live-canary:
    name: live Cursor streaming canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run read-only live canary
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::notice::CURSOR_API_KEY is not configured; skipping live canary"
            exit 0
          fi
          npm run build
          node scripts/live-chat-smoke.mjs
